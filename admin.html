<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة الإدارة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f3a4d;--dark:#0b2d3c;--card:#164a60;--gold:#e8c48a;--muted:#9fb8c4;--red:#d9534f;--green:#3aa76d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',Tahoma,Arial,sans-serif;background:var(--bg);color:#fff;min-height:100vh}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:var(--dark);color:#fff}
input[type=color]{padding:2px;height:42px}
input[type=file]{padding:8px}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
.btn{background:var(--gold);color:#0b2d3c;border:0;border-radius:10px;padding:10px 18px;font-weight:800;font-size:14px}
.btn.sec{background:rgba(255,255,255,.12);color:#fff}
.btn.red{background:var(--red);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.sm{padding:6px 12px;font-size:13px}

/* الدخول */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--card);padding:34px;border-radius:20px;width:100%;max-width:360px;text-align:center}
.login-box h2{margin-bottom:6px}
.login-box p{color:var(--muted);font-size:14px;margin-bottom:16px}
.login-box input{text-align:center;font-size:22px;letter-spacing:6px;margin-bottom:14px}
.err{color:#ff9a96;font-size:14px;min-height:20px;margin-top:8px}

/* التطبيق */
#app{display:none}
.top{background:var(--dark);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:40;gap:10px;flex-wrap:wrap}
.top h1{font-size:19px;color:var(--gold)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:14px 20px 0;max-width:1000px;margin:auto}
.tab{background:rgba(255,255,255,.08);border:0;color:#fff;padding:10px 16px;border-radius:10px 10px 0 0;font-weight:700;font-size:14px}
.tab.on{background:var(--card);color:var(--gold)}
.panel{background:var(--card);max-width:1000px;margin:0 auto 60px;padding:24px 20px;border-radius:0 0 16px 16px;min-height:300px}
.panel h2{margin-bottom:6px;font-size:20px}
.hint{color:var(--muted);font-size:14px;line-height:1.8;margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.box{background:rgba(0,0,0,.2);border-radius:14px;padding:14px;margin-top:14px}
.line{display:flex;gap:8px;align-items:flex-end;margin-top:10px;flex-wrap:wrap}
.line > div{flex:1;min-width:130px}
.line label{margin-top:0}
.imgs{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.imgs .im{position:relative;width:96px;height:96px;border-radius:10px;overflow:hidden;background:#000}
.imgs img{width:100%;height:100%;object-fit:cover}
.imgs .im button{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:13px}
.imgs .im .cv{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.7);font-size:11px;text-align:center;padding:2px;cursor:pointer}
.imgs .im .cv.is{background:var(--gold);color:#0b2d3c;font-weight:800}
.badge{display:inline-block;background:var(--gold);color:#0b2d3c;font-size:12px;font-weight:800;padding:2px 10px;border-radius:20px}
#log{background:#000;color:#9ff0b9;font-family:monospace;font-size:13px;padding:12px;border-radius:10px;margin-top:14px;white-space:pre-wrap;min-height:60px;direction:ltr;text-align:left;max-height:260px;overflow:auto}
.dirty{position:fixed;bottom:18px;right:18px;background:var(--gold);color:#0b2d3c;padding:10px 18px;border-radius:30px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.5);display:none;z-index:60;border:0}
@media(max-width:700px){.row2,.row3{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="login">
  <div class="login-box">
    <h2>🔒 لوحة الإدارة</h2>
    <p>أدخل الرقم السري</p>
    <input type="password" id="pin" inputmode="numeric" autocomplete="off">
    <button class="btn" style="width:100%" id="loginBtn">دخول</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div id="app">
  <div class="top">
    <h1>⚙️ لوحة إدارة الموقع <small style="font-size:12px;color:var(--muted)">(نسخة 6)</small></h1>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <a class="btn sec sm" href="index.html" target="_blank" style="text-decoration:none;display:inline-block">عرض الموقع</a>
      <button class="btn green sm" onclick="publish()">🚀 نشر التعديلات</button>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="panel" id="panel"></div>
</div>
<button class="dirty" id="dirty" onclick="publish()">● توجد تعديلات غير منشورة — اضغط للنشر</button>

<script>
let D = null, tab = 'settings', dirty = false;
const TABS = [['settings','الإعدادات والألوان'],['items','الأعمال'],['publish','النشر والأمان']];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sha = async t => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const $ = id => document.getElementById(id);
const G = () => ({ token: (localStorage.gh_token||'').trim(), owner: (localStorage.gh_owner||'alaqrab009').trim(), repo: (localStorage.gh_repo||'zwajat').trim(), branch: (localStorage.gh_branch||'main').trim() });
const imgSrc = p => {
  if(!p || p.startsWith('data:') || /^https?:/.test(p)) return p;
  const g = G();
  return `https://raw.githubusercontent.com/${g.owner}/${g.repo}/${g.branch}/${p}`;
};

/* ---------- الدخول ---------- */
async function load(){
  try{
    // المصدر الأصح: GitHub مباشرة (الموقع المنشور قد يتأخر دقيقة أو دقيقتين)
    let r = null;
    const g = G();
    if(g.token && g.repo){
      try{
        r = await fetch(`https://api.github.com/repos/${g.owner}/${g.repo}/contents/data.json?ref=${encodeURIComponent(g.branch)}&t=${Date.now()}`,
          { cache:'no-store', headers:{ Authorization:'Bearer '+g.token, Accept:'application/vnd.github.raw' } });
        if(!r.ok) r = null;
      }catch(e){ r = null; }
    }
    if(!r) r = await fetch('data.json?t=' + Date.now(), { cache:'no-store' });
    if(!r.ok) throw 0;
    D = await r.json();
  }catch(e){
    $('loginErr').innerHTML = 'تعذّر تحميل data.json.<br>افتح اللوحة من رابط الاستضافة.';
  }
}
$('loginBtn').onclick = async () => {
  if(!D){ await load(); if(!D) return; }
  const h = await sha($('pin').value.trim());
  if(h === (localStorage.pin_hash || D.settings.pinHash)){ $('login').style.display='none'; $('app').style.display='block'; draw(); }
  else $('loginErr').textContent = 'الرقم السري غير صحيح';
};
$('pin').addEventListener('keydown', e => { if(e.key==='Enter') $('loginBtn').click(); });
load();

/* ---------- أدوات ---------- */
function setPath(path, val){
  const k = path.split('.'); let o = D;
  for(let i=0;i<k.length-1;i++) o = o[k[i]];
  o[k[k.length-1]] = val;
  markDirty();
}
let rev = 0, autoTimer = null;
function markDirty(){
  dirty = true; rev++;
  const b = $('dirty'); b.style.display = 'block';
  b.textContent = G().token ? '● جارٍ الحفظ تلقائياً...' : '● أضف مفتاح GitHub من تبويب «النشر والأمان» ليُحفظ تلقائياً';
  clearTimeout(autoTimer);
  if(G().token) autoTimer = setTimeout(() => publish(true), 3000);
}
function move(arr, i, d){ const j = i + d; if(j<0 || j>=arr.length) return; [arr[i],arr[j]] = [arr[j],arr[i]]; markDirty(); draw(); }
function inp(path, val, type='text', extra=''){ return `<input type="${type}" value="${esc(val)}" data-p="${path}" ${extra}>`; }

document.addEventListener('input', e => {
  const t = e.target; if(!t.dataset || !t.dataset.p) return;
  let v = t.value;
  if(t.dataset.num) v = +v;
  setPath(t.dataset.p, v);
});

function draw(){
  $('tabs').innerHTML = TABS.map(([k,n]) => `<button class="tab ${k===tab?'on':''}" onclick="tab='${k}';draw()">${n}</button>`).join('');
  if(!G().token && tab !== 'publish'){
    $('panel').innerHTML = `<h2>🔒 الصق مفتاح GitHub أولاً</h2>
      <p class="hint">بدون المفتاح لن يُحفظ أي تعديل، وقد تظهر لك بيانات قديمة. ألصق المفتاح مرة واحدة في تبويب «النشر والأمان» ثم اضغط «حفظ المفتاح».</p>
      <button class="btn" onclick="tab='publish';draw()">اذهب إلى النشر والأمان</button>`;
    return;
  }
  $('panel').innerHTML = ({settings:pSettings, items:pItems, publish:pPublish})[tab]();
}

/* ---------- الإعدادات ---------- */
function pSettings(){
  const s = D.settings;
  return `<h2>إعدادات الموقع</h2><p class="hint">كل تغيير هنا يظهر في الموقع بعد الضغط على «نشر التعديلات».</p>
  <div class="row2">
    <div><label>اسم الموقع (الشعار)</label>${inp('settings.siteName', s.siteName)}</div>
    <div><label>الوصف تحت العنوان في الصفحة الرئيسية</label>${inp('settings.tagline', s.tagline)}</div>
    <div><label>رقم الواتساب (بصيغة 9665xxxxxxxx)</label>${inp('settings.waNumber', s.waNumber)}</div>
    <div><label>رسالة الواتساب الجاهزة</label>${inp('settings.waMessage', s.waMessage)}</div>
    <div><label>نص حقوق النشر في الأسفل</label>${inp('settings.footerText', s.footerText)}</div>
    <div><label>نص المطوّر في الأسفل</label>${inp('settings.devText', s.devText)}</div>
    <div><label>عدد الأعمال في كل صفحة</label>${inp('settings.perPage', s.perPage, 'number', 'min="1" data-num="1"')}</div>
  </div>
  <div class="box"><h2 style="font-size:17px">شعار (صورة)</h2>
    <div class="imgs">${s.logoImage ? `<div class="im"><img src="${esc(imgSrc(s.logoImage))}"><button onclick="setPath('settings.logoImage','');draw()">✕</button></div>` : ''}</div>
    <label>اختر صورة الشعار (اختياري)</label><input type="file" accept="image/*" onchange="pickLogo(this)">
  </div>
  <div class="box"><h2 style="font-size:17px">الألوان</h2>
    <div class="row3">
      <div><label>لون الخلفية</label>${inp('settings.bg', s.bg, 'color')}</div>
      <div><label>لون الهيدر والفوتر</label>${inp('settings.bgDark', s.bgDark, 'color')}</div>
      <div><label>لون البطاقات</label>${inp('settings.card', s.card, 'color')}</div>
      <div><label>اللون المميز (ذهبي)</label>${inp('settings.accent', s.accent, 'color')}</div>
    </div>
  </div>
  <div class="box"><h2 style="font-size:17px">روابط التواصل (اتركها فارغة لإخفائها)</h2>
    <div class="row2">
      <div><label>X (تويتر)</label>${inp('settings.social.x', s.social.x)}</div>
      <div><label>إنستغرام</label>${inp('settings.social.instagram', s.social.instagram)}</div>
      <div><label>سناب شات</label>${inp('settings.social.snap', s.social.snap)}</div>
      <div><label>تيك توك</label>${inp('settings.social.tiktok', s.social.tiktok)}</div>
      <div><label>يوتيوب</label>${inp('settings.social.youtube', s.social.youtube)}</div>
    </div>
  </div>`;
}
async function pickLogo(el){
  if(!el.files[0]) return;
  setPath('settings.logoImage', await shrink(el.files[0], 400)); draw();
}

/* ---------- الأعمال ---------- */
function pItems(){
  const list = D.items.map((it,i)=>({it,i})).sort((a,b)=>(b.it.date||'').localeCompare(a.it.date||''));
  return `<h2>الأعمال</h2><p class="hint">العمل الجديد يكون «مسودة» ولا يظهر في الموقع حتى تضغط بجواره «✅ موافقة ونشر». أول صورة هي الغلاف، ويمكنك جعل أي صورة غلافاً بالضغط على «غلاف».</p>
  <button class="btn" onclick="addItem()">+ إضافة عمل جديد</button>
  ${list.map(({it,i})=>{
    const draft = it.published === false;
    return `<div class="box" style="${draft?'border:2px dashed var(--gold)':''}">
    <div class="line" style="margin-top:0;align-items:center;justify-content:space-between">
      <span class="badge" style="${draft?'':'background:#3aa76d;color:#fff'}">${draft?'مسودة — غير ظاهر في الموقع':'✔ منشور في الموقع'}</span>
      ${draft ? `<button class="btn green" onclick="approveItem(${i})">✅ موافقة ونشر</button>` : `<button class="btn sec sm" onclick="hideItem(${i})">إخفاء من الموقع</button>`}
    </div>
    <div class="row2">
      <div><label>العنوان</label>${inp(`items.${i}.title`, it.title)}</div>
      <div><label>التاريخ</label>${inp(`items.${i}.date`, it.date, 'date')}</div>
    </div>
    <label>الوصف (اختياري)</label><textarea data-p="items.${i}.description">${esc(it.description)}</textarea>
    <label>الصور (${it.images.length})</label>
    <div class="imgs">${it.images.map((src,k)=>`<div class="im"><img src="${esc(imgSrc(src))}"><button onclick="delImg(${i},${k})">✕</button><div class="cv ${k===0?'is':''}" onclick="coverImg(${i},${k})">${k===0?'الغلاف':'غلاف'}</div></div>`).join('')}</div>
    <label>إضافة صور (يمكن اختيار عدة صور)</label>
    <input type="file" accept="image/*" multiple onchange="addImgs(${i},this)">
    <div style="margin-top:12px;text-align:left"><button class="btn red sm" onclick="delItem(${i})">🗑 حذف هذا العمل</button></div>
  </div>`;}).join('') || '<div class="hint" style="margin-top:20px">لا توجد أعمال.</div>'}`;
}
function addItem(){
  D.items.unshift({id:'i'+uid(), title:'عمل جديد', date:new Date().toISOString().slice(0,10), images:[], description:'', published:false});
  markDirty(); draw();
}
function approveItem(i){
  D.items[i].published = true; draw();
  rev++; dirty = true; clearTimeout(autoTimer);
  $('dirty').style.display = 'block'; $('dirty').textContent = '● جارٍ النشر...';
  publish(true);
}
function hideItem(i){ D.items[i].published = false; markDirty(); draw(); }
function delItem(i){ if(confirm('حذف هذا العمل؟')){ D.items.splice(i,1); markDirty(); draw(); } }
function delImg(i,k){ D.items[i].images.splice(k,1); markDirty(); draw(); }
function coverImg(i,k){ const a = D.items[i].images; a.unshift(a.splice(k,1)[0]); markDirty(); draw(); }
async function addImgs(i, el){
  for(const f of el.files) D.items[i].images.push(await shrink(f, 1400));
  markDirty(); draw();
}
function shrink(file, max){
  return new Promise(res=>{
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const k = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = Math.round(im.width*k); c.height = Math.round(im.height*k);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg', .85));
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

/* ---------- النشر والأمان ---------- */
function pPublish(){
  const g = G();
  return `<h2>الحفظ والنشر</h2>
  <p class="hint">بعد حفظ المفتاح مرة واحدة، كل تعديل تعمله في اللوحة يُحفظ وينشر تلقائياً خلال ثوانٍ، بدون أي تأكيد. دخولك للوحة هو التأكيد.</p>
  <label>مفتاح GitHub (Token)</label>
  <input type="password" id="gToken" value="${esc(g.token)}" placeholder="الصق المفتاح هنا">
  <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
    <button class="btn" onclick="saveToken()">💾 حفظ المفتاح</button>
    <span class="badge" style="${g.token?'':'display:none'}">✔ يوجد مفتاح محفوظ</span>
  </div>
  <details style="margin-top:14px"><summary style="cursor:pointer;color:var(--muted)">إعدادات متقدمة (لا تغيّرها عادةً)</summary>
    <div class="row2">
      <div><label>اسم الحساب</label><input id="gOwner" value="${esc(g.owner)}"></div>
      <div><label>اسم المستودع</label><input id="gRepo" value="${esc(g.repo)}"></div>
      <div><label>الفرع</label><input id="gBranch" value="${esc(g.branch)}"></div>
    </div>
  </details>
  <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
    <button class="btn green" onclick="publish()">🚀 حفظ ونشر الآن</button>
    <button class="btn sec" onclick="downloadJson()">⬇ نسخة احتياطية</button>
  </div>
  <div id="log">جاهز.</div>
  <div class="box"><h2 style="font-size:17px">تغيير الرقم السري</h2>
    <div class="row2">
      <div><label>الرقم السري الجديد</label><input type="password" id="newPin" inputmode="numeric"></div>
      <div style="align-self:end"><button class="btn" onclick="changePin()">حفظ الرقم</button></div>
    </div>
  </div>`;
}
async function saveToken(){
  localStorage.gh_owner = $('gOwner').value.trim();
  localStorage.gh_repo = $('gRepo').value.trim();
  localStorage.gh_branch = $('gBranch').value.trim() || 'main';
  localStorage.gh_token = $('gToken').value.trim();
  $('log').textContent = 'تم الحفظ. جارٍ اختبار المفتاح...';
  try{
    const g = G();
    const r = await fetch(`https://api.github.com/repos/${g.owner}/${g.repo}`, { headers:{ Authorization:'Bearer '+g.token, Accept:'application/vnd.github+json' } });
    const j = await r.json().catch(()=>({}));
    if(!r.ok) log('❌ المفتاح غير مقبول: ' + (j.message || r.status) + '\nتأكد أنك نسخته كاملاً وأنه مخصص للمستودع ' + g.repo);
    else if(j.permissions && !j.permissions.push) log('⚠️ المفتاح صحيح لكن بدون صلاحية الكتابة. اجعل Contents = Read and write.');
    else {
      await load();   // أحدث بيانات من GitHub مباشرة
      draw(); log('✅ المفتاح صحيح ومعتمد، وتم تحميل أحدث بياناتك (' + D.items.length + ' عمل). يمكنك التعديل الآن.');
    }
  }catch(e){ log('❌ تعذّر الاتصال: ' + e.message); }
}
async function changePin(){
  const v = $('newPin').value.trim();
  if(v.length < 4){ alert('الرقم السري 4 خانات على الأقل'); return; }
  const h = await sha(v);
  D.settings.pinHash = h;
  localStorage.pin_hash = h;   // يعمل فوراً على هذا الجهاز
  markDirty(); $('newPin').value = '';
  const g = G();
  if(g.token && g.repo){
    const ok = await publish();
    if(ok){ localStorage.removeItem('pin_hash'); alert('✅ تم تغيير الرقم السري ونشره، ويعمل على كل الأجهزة.'); }
    else alert('تم تغيير الرقم على هذا الجهاز فقط، لأن النشر فشل. اعتمد المفتاح ثم اضغط «نشر التعديلات» ليعمل على كل الأجهزة.');
  } else {
    alert('تم تغيير الرقم على هذا الجهاز فقط. اعتمد مفتاح GitHub ثم اضغط «نشر التعديلات» ليعمل على كل الأجهزة.');
  }
}
function downloadJson(){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(D,null,2)], {type:'application/json'}));
  a.download = 'data.json'; a.click();
}
const log = m => { const l = $('log'); if(l){ l.textContent += '\n' + m; l.scrollTop = l.scrollHeight; } };
const b64 = s => btoa(unescape(encodeURIComponent(s)));

async function gh(path, opt={}){
  const g = G();
  const r = await fetch(`https://api.github.com/repos/${g.owner}/${g.repo}/contents/${path}`, {
    ...opt, headers:{ Authorization:'Bearer '+g.token, Accept:'application/vnd.github+json', ...(opt.headers||{}) }
  });
  return r;
}
async function put(path, contentB64, msg){
  const g = G();
  let sha;
  for(let attempt = 0; attempt < 3; attempt++){
    const ex = await gh(`${path}?ref=${encodeURIComponent(g.branch)}&t=${Date.now()}`, { cache:'no-store' });
    sha = ex.ok ? (await ex.json()).sha : undefined;
    const r = await gh(path, { method:'PUT', body: JSON.stringify({ message: msg, content: contentB64, branch: g.branch, sha }) });
    if(r.ok) return;
    const e = await r.json().catch(()=>({}));
    if(attempt < 2 && (r.status === 409 || r.status === 422)) { await new Promise(z=>setTimeout(z,800)); continue; }
    throw new Error((e.message||r.status) + ' — ' + path);
  }
}

let publishing = false;
async function publish(silent){
  if(publishing){ if(silent) autoTimer = setTimeout(() => publish(true), 3000); return false; }
  const g = G();
  if(!g.token || !g.repo){ if(!silent){ tab = 'publish'; draw(); alert('الصق مفتاح GitHub أولاً'); } return false; }
  const myRev = rev;
  publishing = true;
  if($('log')) $('log').textContent = 'بدء النشر...';
  $('dirty').textContent = '● جارٍ الحفظ...'; $('dirty').style.display = 'block';
  try{
    // رفع الصور الجديدة
    const up = [];
    const collect = (get, set) => { const v = get(); if(v && v.startsWith('data:')) up.push({v, set}); };
    collect(() => D.settings.logoImage, n => D.settings.logoImage = n);
    D.items.forEach(it => it.images.forEach((s,k) => collect(() => s, n => it.images[k] = n)));
    let n = 0;
    for(const u of up){
      n++;
      const name = `images/${uid()}.jpg`;
      log(`رفع صورة ${n} من ${up.length}...`);
      await put(name, u.v.split(',')[1], 'إضافة صورة');
      u.set(name);
    }
    log('رفع data.json ...');
    await put('data.json', b64(JSON.stringify(D, null, 2)), 'تحديث بيانات الموقع');
    log('✅ تم النشر بنجاح. يظهر التحديث في الموقع خلال دقيقة تقريباً.');
    publishing = false;
    if(rev !== myRev){ autoTimer = setTimeout(() => publish(true), 1500); }
    else { dirty = false; const b = $('dirty'); b.textContent = '✅ تم الحفظ — يظهر في الموقع خلال دقيقة تقريباً'; setTimeout(()=>{ if(!dirty) b.style.display='none'; }, 6000); }
    return true;
  }catch(e){
    log('❌ فشل النشر: ' + e.message);
    $('dirty').textContent = '❌ فشل الحفظ — اضغط للمحاولة ثانية'; $('dirty').style.display = 'block';
    log('تأكد من صحة المفتاح واسم المستودع، وأن للمفتاح صلاحية Contents: Read and write.');
  }
  publishing = false; return false;
}
window.addEventListener('beforeunload', e => { if(dirty){ e.preventDefault(); e.returnValue = ''; } });
